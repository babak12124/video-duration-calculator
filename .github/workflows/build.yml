name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile video_duration_gui.py --name video-duration-calculator-win --clean

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-duration-calculator-windows
          path: dist/video-duration-calculator-win.exe

  build-linux:
    name: Build Linux
    # Pinned on purpose: `ubuntu-latest` moved to 26.04, which renamed packages
    # (the old list asked for libxcb-xinerama1, which never existed) and builds
    # binaries that need a newer glibc than most users have. 24.04 LTS keeps the
    # package names stable and the resulting binary runnable on 24.04+.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Libraries the bundled Qt 6 xcb plugin needs at runtime. They are
          # filtered first, so a package that gets renamed or dropped in a future
          # runner image is skipped with a warning instead of failing the build.
          packages=(
            ffmpeg
            libgl1 libglx0 libegl1 libopengl0
            libxkbcommon0 libxkbcommon-x11-0
            libxcb1 libx11-xcb1
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1
            libxcb-util1
            libxrender1 libxi6 libsm6 libice6
            libfontconfig1 libfreetype6 libdbus-1-3 libharfbuzz0b
          )
          available=()
          for package in "${packages[@]}"; do
            if apt-cache show "$package" >/dev/null 2>&1; then
              available+=("$package")
            else
              echo "::warning::Package '$package' is not available in this runner image; skipping it."
            fi
          done
          if [ ${#available[@]} -eq 0 ]; then
            echo "::error::No system packages could be resolved."
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends "${available[@]}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --windowed --onefile video_duration_gui.py --name video-duration-calculator-linux --clean

      - name: Verify Linux binary
        run: |
          test -f dist/video-duration-calculator-linux
          file dist/video-duration-calculator-linux
          chmod +x dist/video-duration-calculator-linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-duration-calculator-linux
          path: dist/video-duration-calculator-linux

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew install ffmpeg python@3.12

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --windowed --onefile video_duration_gui.py --name video-duration-calculator-macos --clean

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-duration-calculator-macos
          path: dist/video-duration-calculator-macos

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: video-duration-calculator-windows
          path: artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: video-duration-calculator-linux
          path: artifacts/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: video-duration-calculator-macos
          path: artifacts/macos

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/windows/video-duration-calculator-win.exe release/video-duration-calculator-${{ github.ref_name }}-windows.exe
          cp artifacts/linux/video-duration-calculator-linux release/video-duration-calculator-${{ github.ref_name }}-linux
          cp artifacts/macos/video-duration-calculator-macos release/video-duration-calculator-${{ github.ref_name }}-macos

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Video & Audio Duration Calculator ${{ github.ref_name }}
            
            ### Features
            - **Graphical interface (PySide6/Qt 6)** — drag & drop folders, choose video/audio/both, live progress bar, cancel anytime
            - **Persian & English UI** — one-click switch with RTL layout, remembers your choice
            - **Folder tree with per-type breakdown** — shows total, video, audio duration and file count per folder (including subfolders)
            - **Folder size column** — human-readable sizes (GB/MB/KB) aggregated recursively
            - **Dark/Light theme** — toggle with ☀/🌙 button, persisted across sessions
            - **Auto ffprobe detection** — finds FFmpeg on PATH or common install locations; one-time prompt if missing
            - **CSV export** — detailed report saved next to the executable
            - **Portable single-file executables** — no Python or dependencies needed on user's machine
            
            ### Supported formats
            **Video:** mp4, mkv, avi, mov, wmv, flv, webm, m4v, ts, mts, m2ts, vob, ogv, 3gp, 3g2, f4v, divx, xvid, rmvb, asf, mxf
            
            **Audio:** mp3, m4a, aac, wav, flac, ogg, opus, wma, aiff, aif, ape, alac, amr, ac3, dts, mp2
            
            ### Downloads
            - `video-duration-calculator-${{ github.ref_name }}-windows.exe` — Windows 10/11 (64-bit)
            - `video-duration-calculator-${{ github.ref_name }}-linux` — Linux (glibc, 64-bit)
            - `video-duration-calculator-${{ github.ref_name }}-macos` — macOS 11+ (Intel & Apple Silicon)
            
            ### Requirements
            - **Windows/Linux/macOS**: No installation needed — just download and run
            - **FFmpeg (ffprobe)** must be installed and on PATH for duration reading
              - Windows: `winget install Gyan.FFmpeg`
              - Linux: `sudo apt install ffmpeg` / `sudo dnf install ffmpeg`
              - macOS: `brew install ffmpeg`
            - **Linux desktop libraries**: `libxcb-cursor0` is required by Qt 6
              - Debian/Ubuntu: `sudo apt install libxcb-cursor0`
              - Fedora: `sudo dnf install xcb-util-cursor`
          files: |
            release/video-duration-calculator-${{ github.ref_name }}-windows.exe
            release/video-duration-calculator-${{ github.ref_name }}-linux
            release/video-duration-calculator-${{ github.ref_name }}-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}